[project]
name = "courseguard-api"
version = "0.1.0"
description = "YWP Labs AI teaching-assist platform backend (skeleton)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1.0",
    "starlette>=0.40,<0.48",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "PyJWT>=2.8,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "pgvector>=0.3.0,<1.0",
    "pypdf>=4.0,<5.0",
    "python-multipart>=0.0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "anyio>=4.0,<4.15",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
