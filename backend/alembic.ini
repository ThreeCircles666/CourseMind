# Minimal Alembic configuration.
# NOTE: This project intentionally has NO models and NO migrations yet.
# Alembic is installed and configured only so the database layer can be
# built out later. Do not run migrations as part of the current skeleton.

[alembic]
script_location = alembic
prepend_sys_path = .
# The actual URL is read from app settings in alembic/env.py; this value is
# a harmless placeholder and is not used to auto-connect anywhere.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
